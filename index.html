<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c1a">
  <meta name="description" content="Hero: RPG de coleção com batalha automática. Invoque heróis, monte a equipe e avance pela campanha.">
  <title>Hero</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 5v8c0 8-5.5 13-12 15C9.5 28 4 23 4 15V7z' fill='%23f2c14e'/%3E%3Cpath d='M16 8l2.2 5.4 5.8.4-4.4 3.8 1.4 5.6L16 20.2l-5 3 1.4-5.6L8 13.8l5.8-.4z' fill='%23110e1d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topo">
      <button class="marca" data-acao="aba" data-aba="inicio" aria-label="Hero, ir para o início">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 5v8c0 8-5.5 13-12 15C9.5 28 4 23 4 15V7z" fill="#f2c14e"/><path d="M16 8l2.2 5.4 5.8.4-4.4 3.8 1.4 5.6L16 20.2l-5 3 1.4-5.6L8 13.8l5.8-.4z" fill="#110e1d"/></svg>
        <span>Hero</span>
      </button>
      <nav class="topo__nav" id="nav-topo" aria-label="Seções do jogo"></nav>
      <div class="topo__recursos">
        <span class="recurso recurso--nivel" id="r-nivel" data-dica="Nível da guilda"></span>
        <span class="recurso" id="r-moedas" data-dica="Moedas"></span>
        <button class="btn-icone" data-acao="aba" data-aba="guilda" aria-label="Guilda e conta" id="b-guilda"></button>
      </div>
    </header>

    <main class="conteudo" id="tela"></main>

    <nav class="nav-baixo" id="nav-baixo" aria-label="Seções do jogo"></nav>
  </div>

  <div id="batalha" class="camada" hidden></div>
  <div id="revelar" class="camada revelar" hidden></div>
  <div id="modal" class="camada modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config-supabase.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/bonecos.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/campo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
